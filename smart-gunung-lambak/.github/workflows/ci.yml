name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

jobs:
  web:
    name: Lint, typecheck, build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Start standalone server
        run: |
          npm run start &
          echo $! > /tmp/lambak-server.pid
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/api/v1/health; then
              break
            fi
            sleep 1
          done

      - name: Run API and PWA smoke tests
        run: npm run test:smoke

      - name: Stop server
        if: always()
        run: |
          if [ -f /tmp/lambak-server.pid ]; then
            kill "$(cat /tmp/lambak-server.pid)" || true
          fi

  production-audit:
    name: Production dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev
