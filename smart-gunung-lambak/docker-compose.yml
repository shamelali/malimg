services:
  db:
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app_db
    ports:
      - "5432:5432"
    volumes:
      - lambak_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app_db"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build:
      context: .
      target: builder
    working_dir: /app
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/app_db
    command: sh -c "npm run db:push && npm run db:seed"
    depends_on:
      db:
        condition: service_healthy

  app:
    build:
      context: .
      target: runner
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/app_db
      NEXT_PUBLIC_APP_NAME: Smart Gunung Lambak
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  lambak_pgdata:
